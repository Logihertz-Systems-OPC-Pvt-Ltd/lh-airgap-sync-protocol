name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Lint with Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Binaries (cargo build)
        run: cargo build

      - name: Run Test Suite (cargo test)
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Verify CLI Smoke Operations
        run: |
          ./target/release/lh-airgap-sync --version
          ./target/release/lh-airgap-sync --help
          ./target/release/lh-airgap-sync scan fixtures/hardened_airgap_policy.json
          ./target/release/lh-airgap-sync scan fixtures/hardened_airgap_policy.json --format json
          ./target/release/lh-airgap-sync scan fixtures/hardened_airgap_policy.json --format sarif
          ./target/release/lh-airgap-sync encode-burst fixtures/sample_sync_bundle.json
          ./target/release/lh-airgap-sync decode-burst fixtures/sample_sync_bundle.json --drop-shards 0,2
          ./target/release/lh-airgap-sync render-optical --data "SOVEREIGN CI SMOKE TEST"
